<!DOCTYPE html>
<html lang="ua">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chess.org - Sign Up</title>

    <script src="js/config.js"></script>
    <script type="module" src="js/register.js" defer></script>
    <script src="js/header.js" defer></script>

    <link href="css/auth.css" rel="stylesheet">
    <link href="css/header.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>
  <body>

    <header class="site-header">
      <div class="logo">
        <a href="#" class="logoRef">Chess.org</a>
      </div>
      <nav class="navigation">
        <a href="#" class="play">Play</a>
        <a href="#" class="leaders-btn">Leaders</a>
      </nav>
      <nav class="auth">
        <a href="#" class="register">Register</a>
        <a href="#" class="login">Sign in</a>
        <a href="#" class="exit hidden">Exit</a>
      </nav>
    </header>

    <main class="page-wrapper">
      <div class="auth-container">
        <h2>Sign up<br><span class="header-error"></h2>
        <form id="registerForm" method="POST" novalidate>
          
          <div class="form-group">
            <label Sol for="username">Name</label>
            <input type="text" id="username" name="username" required autocomplete="off">
          </div>

          <div class="form-group">
            <label for="email" id="email-label">Email <span class="error"></span></label>
            <input type="email" id="email" name="email" placeholder="GG@gmail.com" required>
          </div>

          <div class="form-group">
            <label for="password" id="password-label">Password <span class="error"></span></label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
          </div>

          <div class="form-group">
            <label for="repeat-password" id="repeat-label">Repeat password <span class="error"></span></label>
            <input type="password" id="repeat-password" name="repeat-password" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn-submit">Sign Up</button>
        </form>
      </div>
    </main>

  </body>
</html>
