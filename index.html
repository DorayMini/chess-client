<!DOCTYPE html>
<html lang="en">
  
  <head>
    <meta charset="UTF-8">
    <title>Chess.org</title>
    <script src="js/config.js"></script>
    <script src="js/main.js" defer></script>
    <script src="js/header.js" defer></script>
    <link href="css/style.css" rel="stylesheet">
    <link href="css/header.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://googleapis.com" rel="stylesheet">

  </head>
  <body>
    
    <header class="site-header">
      <div class="logo">
        <a href="#" class="logoRef">Chess.org</a>
      </div>
      <nav class="navigation">
        <a href="#" class="play">Play</a>
        <a href="#" class="leaders-btn">Leaders</a>
      </nav>
      <nav class="auth">
        <a href="#" class="register">Register</a>
        <a href="#" class="login">Sign in</a>
        <a href="#" class="exit hidden">Exit</a>
      </nav>
    </header>

    <main class="main-content">
      
      <section class="user-card">
        <div class="user-info">
          <div class="avatar-placeholder"></div>
          <div class="user-details">
            <div class="first">
            <p class="username-text">Unknown</p>
            <input type="text" contenteditable="true" id="username-input" class="hidden">
            <span class="email"> </span>
            </div>
            <span class="elo"></span>
          </div>
        </div>
        <button type="button" class="edit-button hidden">
          <svg xmlns="http://w3.org" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207zm-7.468 7.468A.5.5 0 0 1 6 13.5V13h-.5a.5.5 0 0 1-.5-.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.5.5 0 0 1-.175-.032l-.179.178a.5.5 0 0 0-.11.168l-2 5a.5.5 0 0 0 .65.65l5-2a.5.5 0 0 0 .168-.11z"/>
          </svg>
        </button>
      </section>

      <section class="menu-buttons">
        <button type="button" class="menu-button" id="connect">
          <div class="image chess-pattern">
            <svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M24 0V12H36V12.36C15.6 15.24 0 32.88 0 54C0 77.16 18.84 96 42 96C65.16 96 84 77.16 84 54C84 48.6 82.8 43.56 81 39L70.08 43.56C71.4 47.04 72 50.4 72 54.12C72 70.8 58.68 84.12 42 84.12C25.32 84.12 12 70.8 12 54.12C12 37.44 25.32 24.12 42 24.12C45.6 24.12 49.08 24.72 52.56 26.04L56.64 14.76C53.88 13.8 51 13.32 48 12.84V12.12H60V0.12H24V0ZM84 13.92C84 13.92 40.2 47.64 37.92 49.92C35.64 52.32 35.64 55.8 37.92 58.2C40.2 60.6 43.8 60.6 46.2 58.2C48.6 55.8 84.12 13.92 84.12 13.92H84Z" fill="#E6E6E6"/>
            </svg>
          </div>
          <div class="footer">
            <span>Play</span>
          </div>
        </button> 

        <button type="button" class="menu-button" id="rules">
          <div class="image chess-pattern">
            <svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122.88 66.49"><defs><style>.cls-1{fill-rule:evenodd;}</style></defs><title>leaderboard</title><path class="cls-1" d="M2.27,18.3H34.05a2.27,2.27,0,0,1,2.27,2.27V64.22a2.27,2.27,0,0,1-2.27,2.27H2.27A2.27,2.27,0,0,1,0,64.22V20.57A2.27,2.27,0,0,1,2.27,18.3ZM68.4,9.44V31H61V17.39l-4.52,1.8-2-5.3,7.66-4.45ZM26,49.45H11V43.81l2.84-2.75c.62-.57,1.21-1.13,1.77-1.7L17,38a7.69,7.69,0,0,0,1-1.24,3.52,3.52,0,0,0,.54-1,2.82,2.82,0,0,0,.09-.71,1.08,1.08,0,0,0-.5-1.08,4.54,4.54,0,0,0-1.73-.23,24,24,0,0,0-4.32.36l-.69.13L11,28.58a21.3,21.3,0,0,1,7.12-1.21A9.13,9.13,0,0,1,24,29.06a5.64,5.64,0,0,1,2.12,4.68,9.36,9.36,0,0,1-1,4.7A11.9,11.9,0,0,1,21.45,42l-2.19,1.54H26v5.9ZM103.1,37.19q4.82,0,7,1.37t2.18,4.85a6.81,6.81,0,0,1-.44,2.75,4.59,4.59,0,0,1-1.56,1.74A6.49,6.49,0,0,1,112,49.78a5.44,5.44,0,0,1,.52,2.64q0,4.09-2.13,5.65t-6.58,1.55A28.12,28.12,0,0,1,98,59l-1.08-.23L97.07,53q3.77.33,5.37.33a8,8,0,0,0,2.13-.18.76.76,0,0,0,.53-.79.91.91,0,0,0-.37-.83,2.48,2.48,0,0,0-1.37-.33H98.74v-5.8h4.32c1.18,0,1.77-.33,1.77-1s-.75-1-2.26-1c-1,0-2.53.08-4.52.23l-.85.07L97,38.14a26.29,26.29,0,0,1,6.06-1ZM45.55,0H77.33A2.27,2.27,0,0,1,79.6,2.27v62a2.27,2.27,0,0,1-2.27,2.27H45.55a2.27,2.27,0,0,1-2.27-2.27V2.27A2.27,2.27,0,0,1,45.55,0ZM88.83,30.35h31.78a2.28,2.28,0,0,1,2.27,2.27v31.6a2.27,2.27,0,0,1-2.27,2.27H88.83a2.27,2.27,0,0,1-2.27-2.27V32.62a2.27,2.27,0,0,1,2.27-2.27Z"/></svg>
          </div>
          <div class="footer">
            <span>Leaders</span>
          </div>
        </button> 
      </section>

      <section class="history-section">
        <h2>HISTORY</h2>
        <div class="table-container">
          <table class="history-table">
            <thead id="history-head">
              <tr>
                <th></th>
                <th>There are no entries</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="history-body">
            </tbody>
          </table>
        </div>
        <div class="pagination-container">
          <div id="pagination-numbers"></div>
        </div>
      </section>

    </main>

    <dialog class="modal">
      <div class="modal-body">
        <h2>Log in to your account</h2>
    
        <div class="button-group">
          <button type="button" class="sign_in">Sign Up</button>
          <button type="button" class="sign_up">Sign In</button>
        </div>
      </div>
    </dialog>


    
  </body>
</html>
